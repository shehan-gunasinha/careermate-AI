spring:
  datasource:
    url: jdbc:h2:mem:careermate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-1234
  storage:
    dir: ${java.io.tmpdir}/careermate-test-resumes
  gemini:
    api-key: ""
  seed:
    enabled: false
  jobs:
    sync:
      enabled: false
